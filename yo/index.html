<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Radar silenciado</title>
<style>:root{--bg:#f7f8fb;--ink:#0b1220;--ink2:#4d5669}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e18;--ink:#eef2f8;--ink2:#a2adc2}}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 17px/1.5 system-ui,sans-serif;padding:16px}
main{max-width:30rem}h1{font-size:28px;margin:0 0 10px}p{color:var(--ink2);margin:0 0 10px}b{color:var(--ink)}</style></head>
<body><main><h1 id="t">Listo</h1><p id="p">Este móvil ya no avisa al Radar: cuando abras una propuesta desde aquí, no te llegará notificación.</p>
<p>Hazlo una vez en cada navegador que uses (Chrome, Safari y el navegador de WhatsApp si lo abres desde ahí).</p></main>
<script>try{localStorage.setItem("radar-off","1")}catch(e){document.getElementById("t").textContent="No se ha podido guardar";document.getElementById("p").textContent="Este navegador no deja guardar el ajuste (modo privado). Ábrelo en una pestaña normal."}</script>
</body></html>
